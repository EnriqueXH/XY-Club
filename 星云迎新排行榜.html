<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星云活动社 · 迎新排行榜</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #a855f7;
            --primary-light: #c084fc;
            --accent: #d946ef;
            --gold: #fbbf24;
            --silver: #e2e8f0;
            --bronze: #fb923c;
            --bg: #07070c;
            --bg-card: rgba(16, 16, 30, 0.75);
            --text: #f8fafc;
            --text-secondary: #64748b;
            --text-dim: #475569;
            --border: rgba(168, 85, 247, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Noto Sans SC', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        .bg-orb {
            position: fixed; border-radius: 50%; filter: blur(100px);
            opacity: 0.12; pointer-events: none; z-index: 0;
        }
        .orb-1 { width: 350px; height: 350px; background: var(--primary); top: -120px; right: -100px; animation: float 10s ease-in-out infinite; }
        .orb-2 { width: 280px; height: 280px; background: var(--accent); bottom: 5%; left: -80px; animation: float 12s ease-in-out infinite reverse; }
        .orb-3 { width: 220px; height: 220px; background: var(--primary); top: 45%; right: -50px; animation: float 14s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-40px) scale(1.08); }
        }
        .particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
        .particle {
            position: absolute; width: 2px; height: 2px;
            background: var(--primary-light); border-radius: 50%; opacity: 0;
            animation: particle-rise 18s infinite linear;
        }
        @keyframes particle-rise {
            0% { transform: translateY(110vh) translateX(0); opacity: 0; }
            8% { opacity: 0.4; }
            92% { opacity: 0.4; }
            100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
        }
        .header {
            position: relative; z-index: 10; padding: 14px 18px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo-btn {
            width: 46px; height: 46px; border-radius: 50%; overflow: hidden;
            border: 2px solid rgba(168, 85, 247, 0.35);
            box-shadow: 0 0 18px rgba(168, 85, 247, 0.25), inset 0 0 12px rgba(168, 85, 247, 0.08);
            cursor: pointer; transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative; background: rgba(0,0,0,0.4); flex-shrink: 0;
        }
        .logo-btn:hover, .logo-btn:active {
            transform: scale(1.08);
            box-shadow: 0 0 28px rgba(168, 85, 247, 0.45), inset 0 0 18px rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.7);
        }
        .logo-btn img { width: 100%; height: 100%; object-fit: cover; }
        .logo-btn::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background: linear-gradient(135deg, rgba(168,85,247,0.15), transparent);
            pointer-events: none;
        }
        .header-title { text-align: center; flex: 1; padding: 0 10px; }
        .header-title .main-title {
            font-size: 26px; font-weight: 900; letter-spacing: 6px;
            background: linear-gradient(135deg, #ffffff 0%, #e9d5ff 30%, #c084fc 60%, #a855f7 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            filter: drop-shadow(0 0 12px rgba(168,85,247,0.35)) drop-shadow(0 0 30px rgba(168,85,247,0.15));
            line-height: 1.2; position: relative;
        }
        .header-title .main-title::after {
            content: '星云活动社'; position: absolute; left: 0; top: 0; width: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(192,132,252,0.6));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            filter: blur(8px); opacity: 0.6; z-index: -1;
        }
        .header-title .sub-title {
            font-size: 11px; color: var(--text-secondary); margin-top: 4px;
            letter-spacing: 8px; font-weight: 300; text-transform: uppercase;
        }
        .header-spacer { width: 46px; flex-shrink: 0; }

        .time-section {
            position: relative; z-index: 5; padding: 0 20px;
            max-width: 480px; margin: 0 auto 20px;
        }
        .time-card {
            background: linear-gradient(135deg, rgba(16,16,30,0.8), rgba(10,10,20,0.9));
            border: 1px solid var(--border); border-radius: 20px; padding: 18px 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.03);
            position: relative; overflow: hidden;
        }
        .time-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(168,85,247,0.4), transparent);
        }
        .time-urgency {
            font-size: 10px; color: var(--accent); letter-spacing: 3px;
            text-transform: uppercase; margin-bottom: 10px; font-weight: 500;
            display: flex; align-items: center; gap: 6px;
        }
        .time-urgency .pulse {
            width: 6px; height: 6px; background: var(--accent); border-radius: 50%;
            box-shadow: 0 0 8px var(--accent); animation: pulse-dot 1.5s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }
        .deadline-info {
            font-size: 11px; color: var(--text-secondary);
            margin-bottom: 14px; letter-spacing: 1px;
            font-family: 'Orbitron', monospace;
        }
        .deadline-info span { color: var(--primary-light); font-weight: 600; }

        .flip-clock {
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .flip-unit {
            position: relative; width: 38px; height: 52px; perspective: 200px;
        }
        .flip-unit.wide { width: 46px; }
        .flip-static {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron', monospace; font-size: 28px; font-weight: 700; color: #fff;
            background: linear-gradient(180deg, #1a1a35, #0f0f20);
            border-radius: 6px; border: 1px solid rgba(168, 85, 247, 0.25);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.1), inset 0 1px 0 rgba(255,255,255,0.05);
            text-shadow: 0 0 10px rgba(168,85,247,0.5), 0 0 20px rgba(168,85,247,0.3);
            z-index: 1;
        }
        .flip-static::before {
            content: ''; position: absolute; left: 2px; right: 2px; top: 50%; height: 1px;
            background: rgba(0,0,0,0.5); z-index: 2;
        }
        .flip-card {
            position: absolute; inset: 0; transform-style: preserve-3d;
            z-index: 3; display: none;
        }
        .flip-half {
            position: absolute; left: 0; width: 100%; height: 50%; overflow: hidden;
            backface-visibility: hidden;
            font-family: 'Orbitron', monospace; font-size: 28px; font-weight: 700; color: #fff;
            background: linear-gradient(180deg, #1a1a35, #0f0f20);
            border: 1px solid rgba(168, 85, 247, 0.3);
            text-shadow: 0 0 10px rgba(168,85,247,0.5);
        }
        .flip-half.top { top: 0; border-radius: 6px 6px 0 0; border-bottom: none; transform-origin: bottom; }
        .flip-half.bottom { bottom: 0; border-radius: 0 0 6px 6px; border-top: none; transform-origin: top; }
        .flip-half .val { position: absolute; left: 0; width: 100%; text-align: center; line-height: 52px; }
        .flip-half.top .val { bottom: 0; }
        .flip-half.bottom .val { top: 0; }
        .flip-half.new { z-index: 4; }
        .flip-half.old { z-index: 5; }
        .flip-half.old.top { animation: flip-top 0.45s ease-in forwards; }
        .flip-half.new.bottom { animation: flip-bottom 0.45s ease-out 0.22s forwards; transform: rotateX(90deg); }
        @keyframes flip-top {
            0% { transform: rotateX(0); }
            100% { transform: rotateX(-90deg); }
        }
        @keyframes flip-bottom {
            0% { transform: rotateX(90deg); }
            100% { transform: rotateX(0); }
        }
        .clock-sep {
            font-family: 'Orbitron', monospace; font-size: 22px; font-weight: 700;
            color: var(--primary-light); text-shadow: 0 0 10px rgba(168,85,247,0.4);
            animation: blink 1s ease-in-out infinite; padding-bottom: 4px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .time-label {
            display: flex; justify-content: center; gap: 6px; margin-top: 8px;
        }
        .time-label span {
            width: 38px; text-align: center; font-size: 9px;
            color: var(--text-dim); letter-spacing: 1px; font-family: 'Orbitron', monospace;
        }
        .time-label span.wide { width: 46px; }

        .main { position: relative; z-index: 5; padding: 0 16px 50px; max-width: 480px; margin: 0 auto; }
        .top3-section { margin-bottom: 24px; }
        .top3-container {
            display: flex; align-items: flex-end; justify-content: center;
            gap: 14px; padding: 16px 0 8px; position: relative;
        }
        .top3-item { display: flex; flex-direction: column; align-items: center; position: relative; transition: transform 0.3s ease; }
        .top3-item.rank-1 { order: 2; transform: translateY(-16px); }
        .top3-item.rank-2 { order: 1; }
        .top3-item.rank-3 { order: 3; }
        .crown {
            font-size: 32px; margin-bottom: 10px;
            filter: drop-shadow(0 0 12px rgba(251,191,36,0.6));
            animation: crown-float 2s ease-in-out infinite;
        }
        .rank-2 .crown { filter: drop-shadow(0 0 12px rgba(226,232,240,0.5)); animation-delay: 0.3s; }
        .rank-3 .crown { filter: drop-shadow(0 0 12px rgba(251,146,60,0.5)); animation-delay: 0.6s; }
        @keyframes crown-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .top3-name {
            margin-top: 8px; font-size: 16px; font-weight: 700; color: var(--text);
            text-align: center; max-width: 100px; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; letter-spacing: 1px;
        }
        .rank-1 .top3-name { font-size: 18px; }
        .top3-school {
            font-size: 11px; color: var(--text-secondary); margin-top: 4px;
            max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            font-weight: 400; letter-spacing: 0.5px;
        }
        .top3-count {
            margin-top: 10px; font-family: 'Orbitron', monospace; font-size: 20px; font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            display: flex; align-items: center; gap: 3px;
        }
        .rank-1 .top3-count { font-size: 24px; }
        .top3-count .unit {
            font-size: 11px; font-weight: 400; color: var(--text-secondary);
            -webkit-text-fill-color: var(--text-secondary); font-family: 'Noto Sans SC', sans-serif;
        }
        .rank-badge {
            position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 800; color: #000; font-family: 'Orbitron', monospace;
        }
        .rank-1 .rank-badge { background: var(--gold); box-shadow: 0 0 12px rgba(251,191,36,0.5); }
        .rank-2 .rank-badge { background: var(--silver); box-shadow: 0 0 12px rgba(226,232,240,0.3); }
        .rank-3 .rank-badge { background: var(--bronze); box-shadow: 0 0 12px rgba(251,146,60,0.3); }

        .list-section {
            background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border);
            backdrop-filter: blur(20px); overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 60px rgba(168,85,247,0.04);
        }
        .list-header {
            display: grid; grid-template-columns: 44px 1fr 72px;
            padding: 14px 18px; border-bottom: 1px solid rgba(168,85,247,0.08);
        }
        .list-header span {
            font-size: 10px; color: var(--text-dim); font-weight: 500;
            letter-spacing: 2px; text-transform: uppercase; font-family: 'Orbitron', monospace;
        }
        .list-header span:nth-child(2) { text-align: left; padding-left: 8px; }
        .list-header span:nth-child(3) { text-align: right; }
        .list-item {
            display: grid; grid-template-columns: 44px 1fr 72px;
            align-items: center; padding: 14px 18px;
            border-bottom: 1px solid rgba(168,85,247,0.04);
            transition: all 0.25s ease; position: relative;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item::before {
            content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 2px; height: 0;
            background: linear-gradient(180deg, var(--primary), var(--accent));
            border-radius: 0 2px 2px 0; transition: height 0.35s ease;
        }
        .list-item:hover::before, .list-item:active::before { height: 50%; }
        .list-item:hover, .list-item:active { background: rgba(168,85,247,0.04); }
        .list-rank {
            font-family: 'Orbitron', monospace; font-size: 14px; font-weight: 600;
            color: var(--text-dim); text-align: center;
        }
        .list-info { padding-left: 8px; min-width: 0; }
        .list-name {
            font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 3px;
            letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .list-school {
            font-size: 11px; color: var(--text-secondary); font-weight: 400;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .list-count {
            text-align: right; font-family: 'Orbitron', monospace; font-size: 17px; font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .list-count .unit {
            font-size: 10px; font-weight: 400; color: var(--text-dim);
            -webkit-text-fill-color: var(--text-dim); margin-left: 2px;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-dim); }
        .empty-state .icon { font-size: 40px; margin-bottom: 10px; opacity: 0.4; }
        .empty-state p { font-size: 13px; letter-spacing: 1px; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            padding: 20px; opacity: 0; visibility: hidden; transition: all 0.35s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal {
            background: linear-gradient(145deg, #13131f, #0c0c18); border: 1px solid var(--border);
            border-radius: 24px; width: 100%; max-width: 420px; padding: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 50px rgba(168,85,247,0.08);
            transform: scale(0.92) translateY(20px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.active .modal { transform: scale(1) translateY(0); }
        .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
        .modal-title {
            font-size: 18px; font-weight: 700;
            background: linear-gradient(135deg, #fff, var(--primary-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            letter-spacing: 1px;
        }
        .modal-close {
            width: 34px; height: 34px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03);
            color: var(--text-dim); display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 20px; transition: all 0.2s;
        }
        .modal-close:hover { background: rgba(255,255,255,0.08); color: var(--text); }
        .form-group { margin-bottom: 18px; }
        .form-label {
            display: block; font-size: 11px; color: var(--text-secondary);
            margin-bottom: 8px; letter-spacing: 1px; text-transform: uppercase; font-weight: 500;
        }
        .form-input {
            width: 100%; padding: 13px 16px; background: rgba(255,255,255,0.02);
            border: 1px solid rgba(168,85,247,0.15); border-radius: 14px;
            color: var(--text); font-size: 14px; font-family: inherit;
            outline: none; transition: all 0.2s; letter-spacing: 0.5px;
        }
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(168,85,247,0.08), 0 0 15px rgba(168,85,247,0.1);
        }
        .form-input::placeholder { color: rgba(100,116,139,0.35); }
        textarea.form-input { min-height: 140px; resize: vertical; line-height: 1.7; font-size: 13px; }

        .preview-section {
            margin-bottom: 18px;
            border: 1px solid rgba(168,85,247,0.1);
            border-radius: 14px;
            overflow: hidden;
            background: rgba(0,0,0,0.2);
        }
        .preview-header {
            display: grid;
            grid-template-columns: 40px 1fr 60px 60px;
            padding: 10px 14px;
            background: rgba(168,85,247,0.06);
            border-bottom: 1px solid rgba(168,85,247,0.08);
        }
        .preview-header span {
            font-size: 9px; color: var(--text-dim); font-weight: 500;
            letter-spacing: 1px; text-transform: uppercase; font-family: 'Orbitron', monospace;
        }
        .preview-header span:nth-child(2) { text-align: left; padding-left: 4px; }
        .preview-header span:nth-child(3), .preview-header span:nth-child(4) { text-align: right; }
        .preview-row {
            display: grid;
            grid-template-columns: 40px 1fr 60px 60px;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(168,85,247,0.04);
            font-size: 13px;
            align-items: center;
        }
        .preview-row:last-child { border-bottom: none; }
        .preview-row .p-rank {
            font-family: 'Orbitron', monospace; font-size: 12px; font-weight: 600;
            color: var(--text-dim); text-align: center;
        }
        .preview-row .p-name {
            color: var(--text); font-weight: 600;
            padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .preview-row .p-school {
            color: var(--text-secondary); font-size: 11px;
            text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .preview-row .p-count {
            font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700;
            color: var(--primary-light); text-align: right;
        }
        .preview-empty {
            text-align: center; padding: 20px; color: var(--text-dim); font-size: 12px;
        }

        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 14px;
            font-size: 14px; font-weight: 600; font-family: inherit;
            cursor: pointer; transition: all 0.25s; letter-spacing: 1px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #7e22ce); color: white;
            box-shadow: 0 4px 20px rgba(168,85,247,0.25);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(168,85,247,0.35); }
        .btn-primary:active { transform: translateY(0); }
        .btn-secondary {
            background: rgba(255,255,255,0.03); color: var(--text-secondary);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.06); }
        .btn-danger {
            background: rgba(239,68,68,0.08); color: #ef4444;
            border: 1px solid rgba(239,68,68,0.15);
            font-size: 12px; padding: 10px; width: auto; min-width: 100px;
            display: inline-block;
        }
        .btn-danger:hover { background: rgba(239,68,68,0.12); }

        .btn-row {
            display: flex; gap: 10px; align-items: center; margin-top: 16px;
        }
        .btn-row .btn-primary { flex: 1; }

        .hint {
            font-size: 10px; color: rgba(100,116,139,0.45); margin-top: 8px;
            line-height: 1.6; letter-spacing: 0.3px;
        }
        .error-msg { color: #ef4444; font-size: 12px; margin-top: 6px; display: none; letter-spacing: 0.5px; }
        .error-msg.show { display: block; }
        .toast {
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, var(--primary), #7e22ce); color: white;
            padding: 12px 28px; border-radius: 14px; font-size: 13px; font-weight: 500;
            box-shadow: 0 8px 30px rgba(168,85,247,0.35); z-index: 2000; opacity: 0;
            transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none; letter-spacing: 1px;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: slideUp 0.55s ease forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.35s; }
        @media (max-width: 360px) {
            .header-title .main-title { font-size: 22px; letter-spacing: 4px; }
            .flip-unit { width: 34px; height: 46px; }
            .flip-unit.wide { width: 42px; }
            .flip-static { font-size: 24px; }
            .flip-half { font-size: 24px; }
            .flip-half .val { line-height: 46px; }
            .clock-sep { font-size: 18px; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <script>
        const defaultData = [
            { name: "张壮", school: "北京大学", count: 42 },
            { name: "李明", school: "清华大学", count: 38 },
            { name: "王雪", school: "复旦大学", count: 35 },
            { name: "陈宇", school: "浙江大学", count: 31 },
            { name: "刘涵", school: "南京大学", count: 28 },
            { name: "赵琪", school: "武汉大学", count: 25 },
            { name: "孙伟", school: "中山大学", count: 22 },
            { name: "周婷", school: "四川大学", count: 19 },
            { name: "吴博", school: "华中科技大学", count: 16 },
            { name: "郑悦", school: "西安交通大学", count: 14 }
        ];

        const ADMIN_CODE = "xyclub6677";
        const DEADLINE = new Date('2026-10-15T22:00:00').getTime();

        function anonymize(name) {
            if (!name || name.length < 2) return name;
            if (name.length === 2) {
                return name[0] + '*';
            } else if (name.length === 3) {
                return name[0] + '*' + name[2];
            } else if (name.length === 4) {
                return name[0] + '**' + name[3];
            } else {
                return name[0] + '**' + name[name.length - 1];
            }
        }

        const clockUnits = ['d1','d2','h1','h2','m1','m2','s1','s2'];
        let prevTime = {};

        function initClock() {
            const container = document.getElementById('flipClock');
            clockUnits.forEach((id, idx) => {
                const unit = document.createElement('div');
                unit.className = 'flip-unit' + (id.startsWith('d') ? ' wide' : '');
                unit.id = 'unit-' + id;
                unit.innerHTML = `
                    <div class="flip-static" data-val="0">0</div>
                    <div class="flip-card" id="card-${id}">
                        <div class="flip-half top old"><div class="val">0</div></div>
                        <div class="flip-half bottom old"><div class="val">0</div></div>
                        <div class="flip-half top new"><div class="val">0</div></div>
                        <div class="flip-half bottom new"><div class="val">0</div></div>
                    </div>
                `;
                container.appendChild(unit);
                if (idx === 1 || idx === 3 || idx === 5) {
                    const sep = document.createElement('div');
                    sep.className = 'clock-sep';
                    sep.textContent = ':';
                    sep.style.animationDelay = (idx * 0.1) + 's';
                    container.appendChild(sep);
                }
                prevTime[id] = '0';
            });
        }

        function updateClock() {
            const now = Date.now();
            let diff = DEADLINE - now;
            if (diff < 0) diff = 0;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            const d = String(days).padStart(2, '0');
            const h = String(hours).padStart(2, '0');
            const m = String(minutes).padStart(2, '0');
            const s = String(seconds).padStart(2, '0');

            const values = {
                d1: d[0], d2: d[1],
                h1: h[0], h2: h[1],
                m1: m[0], m2: m[1],
                s1: s[0], s2: s[1]
            };

            for (let key in values) {
                if (values[key] !== prevTime[key]) {
                    flipDigit(key, values[key]);
                    prevTime[key] = values[key];
                }
            }
        }

        function flipDigit(id, newVal) {
            const unit = document.getElementById('unit-' + id);
            const staticEl = unit.querySelector('.flip-static');
            const card = document.getElementById('card-' + id);
            const oldTop = card.querySelector('.flip-half.top.old');
            const oldBottom = card.querySelector('.flip-half.bottom.old');
            const newTop = card.querySelector('.flip-half.top.new');
            const newBottom = card.querySelector('.flip-half.bottom.new');
            const oldVal = staticEl.getAttribute('data-val');

            oldTop.querySelector('.val').textContent = oldVal;
            oldBottom.querySelector('.val').textContent = oldVal;
            newTop.querySelector('.val').textContent = newVal;
            newBottom.querySelector('.val').textContent = newVal;

            card.style.display = 'block';
            staticEl.style.opacity = '0';

            oldTop.style.animation = 'none';
            oldBottom.style.animation = 'none';
            newTop.style.animation = 'none';
            newBottom.style.animation = 'none';

            void oldTop.offsetWidth;

            oldTop.style.animation = 'flip-top 0.45s ease-in forwards';
            newBottom.style.animation = 'flip-bottom 0.45s ease-out 0.22s forwards';

            setTimeout(() => {
                staticEl.textContent = newVal;
                staticEl.setAttribute('data-val', newVal);
                staticEl.style.opacity = '1';
                card.style.display = 'none';
            }, 500);
        }

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 18; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 18 + 's';
                p.style.animationDuration = (12 + Math.random() * 10) + 's';
                container.appendChild(p);
            }
        }

        function render(data) {
            data.sort((a, b) => b.count - a.count);

            const top3Container = document.getElementById('top3Container');
            const medals = ['🥇', '🥈', '🥉'];
            const top3 = data.slice(0, 3);
            const order = [1, 0, 2];

            top3Container.innerHTML = order.map((idx, i) => {
                const item = top3[idx];
                if (!item) return '';
                const rank = idx + 1;
                return `
                    <div class="top3-item rank-${rank}" style="animation: slideUp 0.6s ease ${0.15 * i}s both;">
                        <div class="crown">${medals[idx]}</div>
                        <div class="top3-name">${anonymize(item.name)}</div>
                        <div class="top3-school">${item.school}</div>
                        <div class="top3-count">${item.count}<span class="unit">人</span></div>
                        <div class="rank-badge">${rank}</div>
                    </div>
                `;
            }).join('');

            const listContainer = document.getElementById('listContainer');
            const rest = data.slice(3, 10);

            if (rest.length === 0 && data.length <= 3) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📋</div>
                        <p>暂无更多数据</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = rest.map((item, idx) => `
                <div class="list-item" style="animation: slideUp 0.45s ease ${0.08 * idx}s both;">
                    <div class="list-rank">${idx + 4}</div>
                    <div class="list-info">
                        <div class="list-name">${anonymize(item.name)}</div>
                        <div class="list-school">${item.school}</div>
                    </div>
                    <div class="list-count">${item.count}<span class="unit">人</span></div>
                </div>
            `).join('');
        }

        function parseData(raw) {
            const lines = raw.split(/\n/);
            const data = [];
            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed) continue;
                const parts = trimmed.split(/[\t,，\s]+/);
                if (parts.length >= 3) {
                    const count = parseInt(parts[parts.length - 1]);
                    if (!isNaN(count)) {
                        const school = parts.slice(1, parts.length - 1).join(' ');
                        data.push({ name: parts[0], school: school, count: count });
                    }
                }
            }
            return data;
        }

        function renderPreview() {
            const raw = document.getElementById('dataInput').value.trim();
            const container = document.getElementById('previewSection');

            if (!raw) {
                container.innerHTML = '<div class="preview-empty">请在上方录入数据以预览排名</div>';
                return;
            }

            const data = parseData(raw);
            if (data.length === 0) {
                container.innerHTML = '<div class="preview-empty">未识别到有效数据，请检查格式</div>';
                return;
            }

            data.sort((a, b) => b.count - a.count);

            let html = `
                <div class="preview-header">
                    <span>RK</span>
                    <span>NAME</span>
                    <span>SCHOOL</span>
                    <span>NUM</span>
                </div>
            `;

            html += data.slice(0, 15).map((item, idx) => `
                <div class="preview-row">
                    <div class="p-rank">${idx + 1}</div>
                    <div class="p-name">${anonymize(item.name)}</div>
                    <div class="p-school">${item.school}</div>
                    <div class="p-count">${item.count}</div>
                </div>
            `).join('');

            if (data.length > 15) {
                html += `<div class="preview-empty">... 还有 ${data.length - 15} 条数据未显示</div>`;
            }

            container.innerHTML = html;
        }

        function openAdmin() {
            document.getElementById('adminModal').classList.add('active');
            document.getElementById('verifyInput').value = '';
            document.getElementById('verifyError').classList.remove('show');
            showVerifyStep();
            setTimeout(() => document.getElementById('verifyInput').focus(), 150);
        }

        function closeAdmin() {
            document.getElementById('adminModal').classList.remove('active');
        }

        function showVerifyStep() {
            document.getElementById('verifyStep').style.display = 'block';
            document.getElementById('dataStep').style.display = 'none';
            document.getElementById('modalTitle').textContent = '管理员验证';
        }

        function showDataStep() {
            document.getElementById('verifyStep').style.display = 'none';
            document.getElementById('dataStep').style.display = 'block';
            document.getElementById('modalTitle').textContent = '数据管理';

            const saved = localStorage.getItem('nebula_rank_data');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('dataInput').value = data.map(d => `${d.name}\t${d.school}\t${d.count}`).join('\n');
            } else {
                document.getElementById('dataInput').value = '';
            }
            renderPreview();
        }

        function verifyAdmin() {
            const input = document.getElementById('verifyInput').value.trim();
            if (input === ADMIN_CODE) {
                showDataStep();
                showToast('验证成功 ✓');
            } else {
                document.getElementById('verifyError').classList.add('show');
                document.getElementById('verifyInput').value = '';
                document.getElementById('verifyInput').focus();
            }
        }

        function updateData() {
            const raw = document.getElementById('dataInput').value.trim();
            if (!raw) {
                showToast('请输入数据');
                return;
            }

            if (!confirm('确认更新排行榜？此操作将覆盖现有数据。')) {
                return;
            }

            const data = parseData(raw);

            if (data.length === 0) {
                showToast('未识别到有效数据，请检查格式');
                return;
            }

            localStorage.setItem('nebula_rank_data', JSON.stringify(data));
            render(data);
            closeAdmin();
            showToast(`已更新 ${data.length} 条数据 ✓`);
        }

        function clearData() {
            if (!confirm('确定要清空所有数据吗？此操作不可恢复。')) {
                return;
            }
            localStorage.removeItem('nebula_rank_data');
            render(defaultData);
            document.getElementById('dataInput').value = '';
            renderPreview();
            closeAdmin();
            showToast('数据已重置');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        document.getElementById('adminModal').addEventListener('click', function(e) {
            if (e.target === this) closeAdmin();
        });

        document.getElementById('dataInput').addEventListener('input', renderPreview);

        function init() {
            const saved = localStorage.getItem('nebula_rank_data');
            const data = saved ? JSON.parse(saved) : defaultData;
            render(data);
            createParticles();
            initClock();
            updateClock();
            setInterval(updateClock, 1000);
        }

        init();
    </script>
</body>
</html>
