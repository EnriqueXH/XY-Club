// ===== Canvas 十字星光背景 =====
(function(){
  var canvas = document.getElementById('starCanvas');
  var ctx = canvas.getContext('2d');
  var stars = [];
  var w, h;
  function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;}
  resize();
  window.addEventListener('resize', resize);
  for(var i=0;i<60;i++){
    stars.push({
      x:Math.random()*w,y:Math.random()*h,
      r:Math.random()*1.2+.4,
      vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15-.08,
      alpha:Math.random(),fade:Math.random()*.012+.003,
      rot:Math.random()*Math.PI,
      rotSpeed:(Math.random()-.5)*.01,
      color:Math.random()>.6?'168,85,247':Math.random()>.5?'217,70,239':'200,200,220'
    });
  }
  var meteors = [];
  function draw(){
    ctx.clearRect(0,0,w,h);
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      s.x+=s.vx;s.y+=s.vy;s.rot+=s.rotSpeed;
      s.alpha+=s.fade;
      if(s.alpha>1||s.alpha<0)s.fade=-s.fade;
      if(s.x<0)s.x=w;if(s.x>w)s.x=0;
      if(s.y<0)s.y=h;if(s.y>h)s.y=0;
      ctx.save();
      ctx.translate(s.x,s.y);
      ctx.rotate(s.rot);
      ctx.beginPath();
      var len=s.r*4;
      ctx.moveTo(0,-len);ctx.lineTo(0,len);
      ctx.moveTo(-len,0);ctx.lineTo(len,0);
      ctx.strokeStyle='rgba('+s.color+','+Math.abs(s.alpha)+')';
      ctx.lineWidth=s.r*.6;
      ctx.shadowBlur=14;
      ctx.shadowColor='rgba('+s.color+','+Math.abs(s.alpha)*.7+')';
      ctx.stroke();
      // 中心点
      ctx.beginPath();
      ctx.arc(0,0,s.r*.5,0,Math.PI*2);
      ctx.fillStyle='rgba('+s.color+','+Math.abs(s.alpha)+')';
      ctx.fill();
      ctx.restore();
    }
    // 流星
    if(Math.random()<.012){
      meteors.push({x:Math.random()*w,y:Math.random()*h*.3,vx:-(Math.random()*4+3),vy:Math.random()*2+1,len:Math.random()*80+50,life:1});
    }
    for(var m=0;m<meteors.length;m++){
      var mt=meteors[m];
      mt.x+=mt.vx;mt.y+=mt.vy;mt.life-=0.018;
      if(mt.life<=0){meteors.splice(m,1);m--;continue;}
      var grad=ctx.createLinearGradient(mt.x,mt.y,mt.x-mt.len,mt.y+mt.len*.5);
      grad.addColorStop(0,'rgba(200,170,255,'+mt.life*.7+')');
      grad.addColorStop(1,'rgba(168,85,247,0)');
      ctx.beginPath();
      ctx.moveTo(mt.x,mt.y);
      ctx.lineTo(mt.x-mt.len,mt.y+mt.len*.5);
      ctx.strokeStyle=grad;
      ctx.lineWidth=1.2;
      ctx.stroke();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

function updateClock(){
var now=Date.now(),diff=DL-now;if(diff<0)diff=0;
var days=Math.floor(diff/864e5),hrs=Math.floor(diff%864e5/36e5),mins=Math.floor(diff%36e5/6e4),secs=Math.floor(diff%6e4/1e3);
var d=String(days).padStart(2,"0"),h=String(hrs).padStart(2,"0"),m=String(mins).padStart(2,"0"),s=String(secs).padStart(2,"0");
var v={d1:d[0],d2:d[1],h1:h[0],h2:h[1],m1:m[0],m2:m[1],s1:s[0],s2:s[1]};
for(var k in v){if(v[k]!==pt[k]){flip(k,v[k]);pt[k]=v[k]}}
}

function parse(raw){
var lines=raw.split(/
/),data=[];
for(var i=0;i<lines.length;i++){
var t=lines[i].trim();if(!t)continue;
var p=t.split(/[	,，\s]+/);if(p.length>=3){var c=parseInt(p[p.length-1]);if(!isNaN(c)){var sc=p.slice(1,p.length-1).join(" ");data.push({n:p[0],s:sc,c:c})}}

// ==================== GitHub Gist 同步核心逻辑 ====================

function setSyncStatus(connected, text) {
    var dot = document.getElementById("syncDot");
    var txt = document.getElementById("syncText");
    var btn = document.getElementById("refreshBtn");
    if(connected){dot.classList.remove("off");btn.disabled=false;}
    else{dot.classList.add("off");btn.disabled=true;}
    if(text)txt.textContent=text;
}

function manualSync(){
    if(isSyncing)return;
    toast("正在同步...");
    pullFromGist(function(data){
        if(data!==null){
            currentData = data && data.length ? data : def;
            render(currentData);
            toast("已同步最新数据 ✓");
        } else {
            toast("同步失败，请检查配置", true);
        }
    });
}

function forceSync(){
    manualSync();
}

function pushToGist(data, callback){
    if(!GITHUB_TOKEN || GITHUB_TOKEN.indexOf('xxxx')>-1){
        toast("请先配置 GitHub Token", true);
        if(callback)callback(false);
        return;
    }
    isSyncing = true;
    setSyncStatus(false, "正在推送...");

    var payload = {
        description: "星云活动社排行榜数据",
        public: false,
        files: {}
    };
    payload.files[GIST_FILENAME] = {content: JSON.stringify(data, null, 2)};

    var url = GIST_ID 
        ? 'https://api.github.com/gists/' + GIST_ID 
        : 'https://api.github.com/gists';

    fetch(url, {
        method: 'POST',
        headers: {
            'Authorization': 'token ' + GITHUB_TOKEN,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
    })
    .then(function(r){return r.json();})
    .then(function(res){
        isSyncing = false;
        if(res.id){
            if(!GIST_ID){
                console.log('【重要】请记录你的 Gist ID: ' + res.id);
                alert('首次创建成功！\n\n请记录你的 Gist ID：' + res.id + '\n\n请将此 ID 填入代码中的 GIST_ID 变量，否则其他设备无法同步。');
            }
            setSyncStatus(true, "已同步 · " + new Date().toLocaleTimeString());
            if(callback)callback(true);
        } else {
            setSyncStatus(false, "同步失败");
            console.error('Gist error:', res);
            if(callback)callback(false);
        }
    })
    .catch(function(err){
        isSyncing = false;
        setSyncStatus(false, "网络错误");
        console.error('Fetch error:', err);
        if(callback)callback(false);
    });
}

function pullFromGist(callback){
    if(!GITHUB_TOKEN || GITHUB_TOKEN.indexOf('xxxx')>-1){
        setSyncStatus(false, "未配置 Token");
        if(callback)callback(null);
        return;
    }
    if(!GIST_ID){
        setSyncStatus(false, "未配置 Gist ID");
        if(callback)callback(null);
        return;
    }
    isSyncing = true;
    setSyncStatus(false, "正在同步...");

    fetch('https://api.github.com/gists/' + GIST_ID, {
        method: 'GET',
        headers: {
            'Authorization': 'token ' + GITHUB_TOKEN,
            'Accept': 'application/vnd.github.v3+json'
        }
    })
    .then(function(r){return r.json();})
    .then(function(res){
        isSyncing = false;
        if(res.files && res.files[GIST_FILENAME]){
            try{
                var content = res.files[GIST_FILENAME].content;
                var data = JSON.parse(content);
                setSyncStatus(true, "已同步 · " + new Date().toLocaleTimeString());
                if(callback)callback(data);
            }catch(e){
                setSyncStatus(false, "数据解析失败");
                if(callback)callback(null);
            }
        } else if(res.message){
            setSyncStatus(false, "API错误: " + res.message);
            if(callback)callback(null);
        } else {
            setSyncStatus(false, "无数据文件");
            if(callback)callback([]);
        }
    })
    .catch(function(err){
        isSyncing = false;
        setSyncStatus(false, "网络错误");
        console.error('Fetch error:', err);
        if(callback)callback(null);
    });
}

function startAutoSync(){
    syncTimer = setInterval(function(){
        if(document.visibilityState === 'visible' && !isSyncing){
            pullFromGist(function(data){
                if(data!==null){
                    var hasChanged = JSON.stringify(data)!==JSON.stringify(currentData);
                    if(hasChanged){
                        currentData = data && data.length ? data : def;
                        render(currentData);
                        toast("检测到新数据，已自动更新");
                    }
                }
            });
        }
    }, 15000);
}

function init(){
    currentData = def;
    render(currentData);
    initClock();
    updateClock();
    setInterval(updateClock,1000);

    if(!GITHUB_TOKEN || GITHUB_TOKEN.indexOf('xxxx')>-1){
        setSyncStatus(false, "未配置 GitHub Token");
    } else if(!GIST_ID){
        setSyncStatus(false, "首次使用：点击管理入口录入数据后将自动创建 Gist");
    } else {
        setSyncStatus(false, "正在连接...");
        pullFromGist(function(data){
            if(data!==null){
                currentData = data && data.length ? data : def;
                render(currentData);
            }
        });
        startAutoSync();
    }

    document.addEventListener('visibilitychange', function(){
        if(!document.hidden && GIST_ID && GITHUB_TOKEN && GITHUB_TOKEN.indexOf('xxxx')===-1){
            pullFromGist(function(data){
                if(data!==null){
                    var hasChanged = JSON.stringify(data)!==JSON.stringify(currentData);
                    if(hasChanged){
                        currentData = data && data.length ? data : def;
                        render(currentData);
                        toast("已更新至最新数据");
                    }
                }
            });
        }
    });
}
init();
